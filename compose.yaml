services:
  postgres:
    image: postgres:17-alpine
    container_name: gestor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor}
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestor}
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: https://github.com/MarcusVNJ/gestor-api.git#main
    container_name: gestor-backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestor}
      POSTGRES_USER: ${POSTGRES_USER:-gestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestor}
      POSTGRES_PORT: 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gestor}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gestor}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gestor}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestor-frontend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend

volumes:
  postgres-data:
